name: Deploy web app

# Publishes to the gh-pages branch, the same place `npm run deploy:web` does,
# so the site can be deployed from CI or from a laptop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export web build
        run: npx expo export --platform web
        env:
          # GitHub Pages serves the site from /<repo>
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Prepare for GitHub Pages
        run: node scripts/prepare-pages.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: Deploy web app
